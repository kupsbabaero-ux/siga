name: Update Sigabo M3U (All Episodes)

on:
  schedule:
    # Runs every day at 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:   # allows manual run from Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Run updater (ALL episodes Episode 1 → latest)
        run: python update_sigabo.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sigabo.m3u
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-update Sigabo M3U - All episodes $(date -u +%Y-%m-%d)"
            git push
          fi
